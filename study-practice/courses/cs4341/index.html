function drawTopicSelect(){const nav=$('#topicButtons');if(!nav)return;nav.replaceChildren();if(!chapter)return;$( '#topicName' ).textContent=`Chapter ${chapter.number} — ${chapter.title}`;chapter.topics.forEach(t=>{const b=document.createElement('button');b.type='button';b.textContent=t[1];b.setAttribute('aria-current',String(t[0]===topicId));b.onclick=()=>{topicId=t[0];save('lastProblemTopic:'+chapter.id,topicId);drawTopicSelect();render()};nav.append(b)})}
function drawTabs(){const n=$('#tabs');n.replaceChildren();['Reference','Problem Solving','Multiple Choice'].forEach(x=>{const b=document.createElement('button');b.textContent=x;b.setAttribute('aria-pressed',tab===x);b.onclick=()=>{if(tab!==x)mcqViewTopic=null;tab=x;if(x==='Problem Solving'){const saved=read('lastProblemTopic:'+chapter.id,topicId);topicId=chapter.topics.some(t=>t[0]===saved)?saved:chapter.topics[0][0]}drawTabs();drawTopicSelect();render()};n.append(b)})}
function openChapter(c,tid){chapter=c;const saved=read('lastProblemTopic:'+c.id,c.topics[0][0]);topicId=tid||(c.topics.some(t=>t[0]===saved)?saved:c.topics[0][0]);save('lastProblemTopic:'+c.id,topicId);tab='Reference';mcqViewTopic=null;$( '#home' ).classList.add('hidden');$( '#study' ).classList.remove('hidden');drawTopicSelect();drawTabs();render()}
function render(){const p=$('#panel'),nav=$('#topicButtons');if(nav)nav.classList.toggle('hidden',tab!=='Problem Solving');if(tab==='Reference')referenceChapter(p);else if(tab==='Problem Solving'){if(!chapter.topics.some(t=>t[0]===topicId))topicId=chapter.topics[0][0];problems(p)}else if(mcqViewTopic){topicId=mcqViewTopic;quiz(p)}else mcqHub(p)}
function referenceChapter(p){const pages=chapter.topics.flatMap(t=>window.REFERENCE_PAGES?.[t[0]]||[]);if(!pages.length){p.innerHTML='<div class="empty">Reference pages for this chapter are intentionally blank.</div>';return}const key=chapter.id+':referencePage',zoomKey=chapter.id+':referenceZoom',at=Math.max(0,Math.min(pages.length-1,read(key,0))),zoom=read(zoomKey,100),source=pages[at];p.innerHTML=`<div class="reference-view"><div class="row reference-controls"><button id="rp" ${at===0?'disabled':''}>Previous</button><span>Page <b>${at+1}</b> of ${pages.length} · Source guide p. ${source}</span><button id="rn" ${at===pages.length-1?'disabled':''}>Next</button><button id="zout">Zoom −</button><span class="badge">${zoom}%</span><button id="zin">Zoom +</button><button id="fit">Fit width</button></div><div class="reference-shell"><div class="paperbox"><img class="page-img" src="assets/reference/page-${String(source).padStart(3,'0')}.png" alt="Original study guide page ${source}, Chapter ${chapter.number}" style="width:${zoom}%"></div></div></div>`;function setPage(n){save(key,n);referenceChapter(p)}$('#rp').onclick=()=>setPage(at-1);$('#rn').onclick=()=>setPage(at+1);$('#zout').onclick=()=>{save(zoomKey,Math.max(70,zoom-10));referenceChapter(p)};$('#zin').onclick=()=>{save(zoomKey,Math.min(180,zoom+10));referenceChapter(p)};$('#fit').onclick=()=>{save(zoomKey,100);referenceChapter(p)}}
function mcqHub(p){p.innerHTML=`<section class="mcq-hub"><h1>Multiple Choice Practice</h1><p class="muted">Select a topic to begin or continue a quiz.</p><div class="mcq-topic-list" id="mcqTopics"></div></section>`;const list=$('#mcqTopics');chapter.topics.forEach(t=>{const bank=BANKS.questions.filter(q=>q.topic===t[0]),key='mcq:'+t[0],s=reconcileQuizState(read(key,{resolved:{},versions:{},attempts:{},active:null,reports:[],first:{seen:0,correct:0}}),bank);save(key,s);const done=bank.filter(q=>s.resolved[q.id]).length,allDone=bank.length>0&&done===bank.length,active=s.active,buttonText=allDone?'Reset Quiz':active?.submitted?'Review Results':active?'Resume Quiz':'Start Quiz';const row=document.createElement('article');row.className='mcq-topic-row';row.innerHTML=`<div class="mcq-topic-name">${esc(t[1])}</div><div class="mcq-topic-progress"><div class="mcq-progress-track"><i style="width:${bank.length?Math.round(done/bank.length*100):0}%"></i></div></div><div class="mcq-topic-count">${done} / ${bank.length}</div><div class="mcq-topic-action"><button class="mcq-action" type="button">${buttonText}</button></div><div class="mcq-topic-meta">${allDone?'Topic complete':bank.length?`${s.reports.length} quizzes · First-attempt accuracy ${s.first?.seen?Math.round(100*s.first.correct/s.first.seen):0}%`:'No questions available'}</div>`;row.querySelector('button').disabled=!bank.length;row.querySelector('button').onclick=()=>{if(allDone){if(confirm(`Reset the ${t[1]} quiz round? History and attempt statistics will be retained.`)){s.resolved={};s.active=null;save(key,s);mcqHub(p)}return}topicId=t[0];mcqViewTopic=t[0];if(!s.active){startQuiz(s,bank);if(s.active)s.active.quizNumber=s.reports.length+1;save(key,s)}render()};list.append(row)})}
function quiz(p){const tid=mcqViewTopic||topicId,bank=BANKS.questions.filter(q=>q.topic===tid),key='mcq:'+tid,s=reconcileQuizState(read(key,{resolved:{},versions:{},attempts:{},active:null,reports:[],first:{seen:0,correct:0}}),bank);save(key,s);if(!bank.length){p.innerHTML='<div class="empty">No quiz questions are available for this topic.</div>';return}if(s.active?.submitted){quizResults(p,s,bank,tid);return}if(!s.active){startQuiz(s,bank);if(s.active)s.active.quizNumber=s.reports.length+1;save(key,s)}const a=s.active;if(!a)return mcqHub(p);const q=bank.find(x=>x.id===a.ids[a.pos]);if(!q){s.active=null;save(key,s);return mcqHub(p)}const answer=a.answers[q.id],pos=a.pos,chapterTitle=`Chapter ${chapter.number} — ${chapter.title}`,quizNo=a.quizNumber||s.reports.length+1;p.innerHTML=`<section class="mcq-active"><div class="mcq-active-head"><h1>Multiple Choice Practice</h1><p>${esc(chapterTitle)} — Quiz ${quizNo}</p><button id="backMcqTopics" class="subtle-button">← Multiple Choice topics</button></div><div class="qnav mcq-qnav" id="qnav" aria-label="Quiz questions"></div><section class="mcq-question-panel"><p class="mcq-question-count">Question ${pos+1} of ${a.ids.length}</p><h2>${esc(q.prompt)}</h2><div id="answerArea"></div><p class="feedback mcq-warning" id="feedback" role="status">${a.warning?'You have not completed the quiz. Submit again to count unanswered questions as incorrect.':''}</p></section><div class="mcq-controls"><button id="prev" ${pos===0?'disabled':''}>Previous</button><button id="next" ${pos===a.ids.length-1?'disabled':''}>Next</button><button id="submitQuiz">Submit Quiz</button></div></section>`;$('#backMcqTopics').onclick=()=>{mcqViewTopic=null;render()};a.ids.forEach((id,i)=>{const b=document.createElement('button');b.type='button';b.textContent=i+1;b.setAttribute('aria-current',String(pos===i));b.setAttribute('aria-label',`Question ${i+1}${a.answers[id]==null?' unanswered':' answered'}`);b.onclick=()=>{a.pos=i;a.warning=false;save(key,s);render()};$('#qnav').append(b)});const area=$('#answerArea');if(q.type==='matching'){q.pairs.forEach((pair,i)=>{const row=document.createElement('div');row.className='match-row';const left=document.createElement('b');left.textContent=pair.left;const sel=document.createElement('select');sel.setAttribute('aria-label','Match '+pair.left);sel.innerHTML='<option value="">Choose a match</option>'+a.orders[q.id].map(j=>`<option value="${j}" ${answer?.[i]===j?'selected':''}>${esc(q.pairs[j].right)}</option>`).join('');sel.onchange=()=>{if(!a.answers[q.id])a.answers[q.id]=Array(q.pairs.length).fill(null);a.answers[q.id][i]=sel.value===''?null:+sel.value;a.warning=false;save(key,s);$('#feedback').textContent=''};row.append(left,sel);area.append(row)})}else{const ids=q.type==='mcq'?a.orders[q.id]:[0,1],box=document.createElement('div');box.className='quiz-choices';ids.forEach((i,j)=>{const b=document.createElement('button');b.type='button';b.className='quiz-choice';b.setAttribute('aria-pressed',String(answer===i));b.innerHTML=`<span class="quiz-radio" aria-hidden="true"></span><span>${q.type==='tf'?'':String.fromCharCode(65+j)+'. '}${esc(q.choices[i])}</span>`;b.onclick=()=>{a.answers[q.id]=i;a.warning=false;save(key,s);render()};box.append(b)});area.append(box)}$('#prev').onclick=()=>move(-1);$('#next').onclick=()=>move(1);function move(d){a.pos+=d;a.warning=false;save(key,s);render()}$('#submitQuiz').onclick=()=>{const incomplete=a.ids.some(id=>{const x=bank.find(y=>y.id===id),ans=a.answers[id];return x.type==='matching'?!ans||ans.some(v=>v==null):ans==null});if(incomplete&&!a.warning){a.warning=true;save(key,s);$('#feedback').textContent='You have not completed the quiz. Submit again to count unanswered questions as incorrect.';return}let score=0;a.ids.forEach(id=>{const x=bank.find(y=>y.id===id),ok=isRight(x,a.answers[id]);s.attempts[id]=(s.attempts[id]||0)+1;if(ok){s.resolved[id]=true;score++}if(s.first&&s.attempts[id]===1){s.first.seen++;if(ok)s.first.correct++}});a.score=score;a.submitted=true;s.reports.push({score,total:a.ids.length,date:new Date().toISOString(),ids:a.ids.slice(),quizNumber:quizNo});save(key,s);render()}}
function quizResults(p,s,bank,tid){const a=s.active,quizNo=a.quizNumber||s.reports.length;p.innerHTML=`<section class="mcq-active mcq-results"><div class="mcq-active-head"><h1>Quiz Results</h1><p>Chapter ${chapter.number} — ${esc(chapter.title)} — Quiz ${quizNo} · Score ${a.score}/${a.ids.length}</p><p class="mcq-result-stats">First-attempt accuracy ${s.first.seen?Math.round(100*s.first.correct/s.first.seen):0}%</p></div><div id="review" class="review-list"></div><div class="mcq-controls"><button id="returnMcqTopics">Back to topics</button></div></section>`;a.ids.forEach((id,number)=>{const q=bank.find(x=>x.id===id);if(!q)return;const ans=a.answers[id],ok=isRight(q,ans),d=document.createElement('article');d.className='review-item';let html=`<p class="quiz-count">Question ${number+1} · ${ok?'Correct':'Incorrect'}</p><h3>${esc(q.prompt)}</h3>`;if(q.type==='matching'){const filled=Array.isArray(ans)&&ans.some(x=>x!=null);if(!filled)html+='<p class="bad">No answer submitted</p>';else if(ans.some(x=>x==null))html+='<p class="bad">Incomplete matching response</p>';q.pairs.forEach((pair,i)=>{const selected=ans?.[i],pairOk=selected===i;html+=`<div class="review-choice ${pairOk?'is-correct':'is-wrong'}"><span class="mark ${pairOk?'good':'bad'}">${pairOk?'✓':'×'}</span><span><b>${esc(pair.left)}</b> → ${selected==null?'No answer submitted':esc(q.pairs[selected]?.right||'Invalid choice')} · Correct: ${esc(pair.right)}</span></div>`})}else{if(ans==null)html+='<p class="bad">No answer submitted</p>';q.choices.forEach((choice,i)=>{const correct=i===q.answer,chosen=i===ans,cls=correct?'is-correct':chosen?'is-wrong':'';html+=`<div class="review-choice ${cls}"><span class="mark ${correct?'good':chosen?'bad':'muted'}">${correct?'✓':chosen?'×':'○'}</span><span>${q.type==='tf'?'':String.fromCharCode(65+i)+'. '}${esc(choice)}${chosen?' · Your answer':''}${correct?' · Correct answer':''}</span></div>`})}html+=`<p class="explanation">${esc(q.explanation)}</p>`;d.innerHTML=html;$('#review').append(d)});$('#returnMcqTopics').onclick=()=>{s.active=null;save('mcq:'+tid,s);mcqViewTopic=null;render()}}

</script><script src="assets/app-overrides.js"></script><script src="assets/navigation.js"></script><script>drawHome();initializeNavigation();initializeHomeTransferTools();</script><script src="../../shared/navigation.js" data-course="cs4341"></script></body></html>
